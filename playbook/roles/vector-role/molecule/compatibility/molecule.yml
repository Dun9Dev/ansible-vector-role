---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: ubuntu-22.04
    image: docker.io/ubuntu:22.04
    pre_build_image: true
  - name: ubuntu-24.04
    image: docker.io/ubuntu:24.04
    pre_build_image: true
  - name: oraclelinux-8
    image: docker.io/oraclelinux:8
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: /usr/bin/python3
verifier:
  name: testinfra

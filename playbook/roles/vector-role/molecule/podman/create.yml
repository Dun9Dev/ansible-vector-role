---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ not (lookup('env', 'MOLECULE_DEBUG') | bool or molecule_yml.provisioner.log|default(false) | bool) }}"
  tasks:
    - name: Create podman containers
      containers.podman.podman_container:
        name: "{{ item.name }}"
        image: "{{ item.image }}"
        state: started
        command: "{{ item.command | default('sleep infinity') }}"
        privileged: "{{ item.privileged | default(False) }}"
      loop: "{{ molecule_yml.platforms }}"
      register: podman_results

    - name: Wait for container to be ready
      ansible.builtin.pause:
        seconds: 5

    - name: Get container facts
      containers.podman.podman_container_info:
        name: "{{ item.name }}"
      loop: "{{ molecule_yml.platforms }}"
      register: container_facts

    - name: Build instance config
      ansible.builtin.set_fact:
        instance_config: "{{ instance_config | default([]) + [{
          'instance': item.item.name,
          'address': item.container.NetworkSettings.IPAddress,
          'user': 'root',
          'port': '22',
          'identity_file': molecule_ephemeral_directory + '/ssh_key'
        }] }}"
      loop: "{{ container_facts.results }}"
      when: item.container is defined

    - name: Write instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed

          {{ instance_config | to_nice_json }}
        dest: "{{ molecule_instance_config }}"
      when: instance_config is defined

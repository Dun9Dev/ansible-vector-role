---
- name: Create vector group
  ansible.builtin.group:
    name: vector
    state: present
    system: true

- name: Create vector user
  ansible.builtin.user:
    name: vector
    group: vector
    home: /opt/vector
    system: true
    shell: /bin/false
    state: present

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: vector
    group: vector
    mode: '0755'
  loop:
    - /opt/vector
    - /etc/vector
    - /var/log/vector

- name: Download Vector with curl
  ansible.builtin.shell: |
    curl -L -o /tmp/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz \
    https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz
  args:
    creates: /tmp/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz

- name: Extract Vector
  ansible.builtin.unarchive:
    src: /tmp/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz
    dest: /opt/vector
    remote_src: true
    owner: vector
    group: vector
    extra_opts:
      - --strip-components=2
    creates: /opt/vector/bin/vector

- name: Install Vector binaries
  ansible.builtin.copy:
    src: /opt/vector/bin/vector
    dest: /usr/local/bin/vector
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Deploy Vector config
  ansible.builtin.template:
    src: vector.yml.j2
    dest: /etc/vector/vector.yml
    owner: root
    group: root
    mode: '0644'

- name: Check if Vector is running
  ansible.builtin.shell: pgrep -f vector
  register: vector_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stop Vector if running
  ansible.builtin.shell: pkill -f vector
  when:
    - vector_running.rc == 0
    - not (skip_vector_stop | default(false) | bool)
  changed_when: true
  ignore_errors: "{{ skip_vector_stop | default(false) | bool }}"
